version = 1

# Marks test and fixture code as such. MEASURED CAVEAT: this does NOT suppress
# the analyzer's anti-pattern rules in these files. Run 098e5306 against commit
# 55c2808 still reported 29 issues here with this setting in force — 24 of them
# JS-0116 "async function without any await" raised against dependency-injection
# stubs, where the `async` is precisely what satisfies the Promise-returning
# interface being stood in for. Those 29 are accepted as a known false-positive
# red on the advisory "DeepSource: JavaScript" check. Do not re-attempt to
# silence them with test_patterns; it was tried and it does not work.
#
# `main` requires exactly one status check — "Static security & build checks" —
# so this analyzer gates nothing. The alternative, rewriting 24 stubs as
# `() => Promise.resolve(...)`, was rejected as making the AI-boundary security
# tests harder to read in exchange for a cosmetic tick.
test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.test.mjs",
]

# Declared explicitly because committing this file switches the repository off
# DeepSource's zero-config auto-detection. All three analyzers that were running
# — and passing — before this file existed are listed so none is silently
# dropped. `plugins = ["react"]` keeps the React rules (JS-0437, JS-0454) that
# the auto-detected setup was already applying.
[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "nodejs", "vitest"]
  dialect = "typescript"
  module_system = "es-modules"

[[analyzers]]
name = "sql"

[[analyzers]]
name = "secrets"
