name: Security CI

# Static verification gate for the DDP security migrations and the app build,
# plus the CI-controlled route to Production.
#
# The `verify` job NEVER connects to a database and uses no secrets.
# The `deploy-production` job is the ONLY authorised automated path to
# Production. It cannot start unless `verify` succeeded.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only. The deployment is performed by the Vercel CLI with a
# project-scoped token, not by the GitHub token, so no write scope is needed here.
permissions:
  contents: read

# Superseded PULL REQUEST runs are cancelled — the original intent, and it only
# ever throws away wasted CI time.
#
# A push to `main` must NOT be cancellable: that run may be part-way through
# promoting a Production deployment, and killing it mid-promotion could leave the
# alias pointing at a half-finished release. Cancellation is therefore scoped to
# pull requests; a second merge queues behind the first (see the deploy job's own
# concurrency group) instead of racing it.
concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Static security & build checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED by the migration collision check below. The
      # default single-ref, depth-1 checkout leaves `origin/main` and the other
      # remote branches unresolvable, and the check would then have nothing to
      # compare and would pass without having verified anything.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      # Dependency advisories, SHIPPED TREE ONLY.
      #
      # --omit=dev is the whole point. The dev tree carries build-chain
      # advisories (postcss, brace-expansion) that never reach a browser, and
      # gating on them would fail every unrelated PR the moment a transitive
      # build dependency is flagged upstream — a gate that fires on things the
      # author cannot fix gets disabled, and then nothing is checked at all.
      #
      # --audit-level=high means moderate and low advisories are reported but do
      # not fail the run. Raise this deliberately, not by accident.
      #
      # Run `npm audit` locally (without --omit=dev) to see the full picture.
      - name: Dependency advisories (production tree)
        run: npm audit --omit=dev --audit-level=high

      # Cheapest gate first: a migration-number collision (two unrelated
      # migrations claiming one number) is invisible on either branch alone and
      # only appears once both land. It broke PR #44 against main's PR #48.
      - name: Migration-number collision guard
        run: npm run verify:migration-numbers

      # A ROLLBACK naming an object the HARDENING never created exits 0 having
      # removed nothing, so a broken undo is indistinguishable from a working
      # one at apply time. This is the no-database half; the catalog snapshot in
      # the disposable-PG harness catches the wrong-signature case it cannot.
      - name: Rollback create/drop symmetry guard
        run: npm run verify:rollback-symmetry

      - name: Security migration static checks
        run: npm run security:sql

      # Quoted: an unquoted `AUDIT-001: ...` contains a ": " and makes the whole
      # workflow file invalid YAML, which fails the run before any job starts.
      #
      # Deliberately NOT --strict. That additionally reports content drift on
      # already-numbered migrations, which is a pre-existing condition across
      # the repository's older branches (migration 3 differs on several) and is
      # unrelated to whether the PR under test introduces a numbering conflict.
      # Gating on it would fail every PR from the day this lands. Run
      # `--strict` manually when reviewing drift.
      - name: 'AUDIT-001: Check migration number collisions'
        run: node scripts/audit-001-check-migration-collisions.mjs

      - name: Unit tests (Vitest)
        run: npm test

      - name: TypeScript compilation
        run: npx tsc -b

      - name: Lint (ESLint)
        run: npm run lint

      - name: Production build (no secrets required)
        run: npm run build

  deploy-production:
    name: Deploy to Production
    # The point of the whole workstream: a deployment cannot begin until
    # verification has SUCCEEDED. `needs` is the mechanical enforcement — if
    # `verify` fails or is cancelled, this job never runs.
    needs: verify
    # Never on a pull request. Only a real push (i.e. a merge) to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Production credentials live ONLY in this environment, which is restricted to
    # protected branches. A run from any other ref cannot read them.
    environment: Production

    # Two merges must not deploy at once. cancel-in-progress is FALSE deliberately:
    # a deployment already promoting must be allowed to finish rather than be killed
    # half-way, so a second merge waits and then deploys on top of it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout the exact merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@56.2.0

      - name: Pull Production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # The deployment is not trusted until the live site proves it.
      #
      # public/version.json is regenerated on every build from `git rev-parse HEAD`
      # (scripts/generate-version.js), so if the commit it reports equals GITHUB_SHA,
      # then the artifact built from THIS commit is the one actually serving the
      # production alias. Anything else — a stale alias, a failed promotion, a race
      # with another deployment — fails the job rather than passing silently.
      - name: Verify the live site serves this exact commit
        run: |
          for attempt in $(seq 1 30); do
            served="$(curl -fsS https://www.ddpbrokerage.com/version.json | jq -r '.commitSha')" || served=""
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "Production serves $GITHUB_SHA (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: production serves '${served:-<unreachable>}', waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::Production did not serve $GITHUB_SHA within the timeout. The deployment did not take effect."
          exit 1
