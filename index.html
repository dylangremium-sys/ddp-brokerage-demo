<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDP Brokerage — Procurement Intelligence</title>
    <!--
      Wording is the landing page's own approved copy (translations.ts
      `landingHero1`) rather than newly authored marketing text, so the
      description cannot assert a capability, certification or compliance
      status the product has not committed to elsewhere.

      No <link rel="canonical"> here on purpose, and the reason has changed.

      It used to be that the vercel.json SPA rewrite served this one document
      for every path, so a hardcoded canonical would also have claimed /farmer.
      That is no longer true: scripts/prerender-public-routes.mjs now writes a
      separate document per public route at build time, each with its own
      canonical, and /farmer has one of its own precisely so it keeps its own.

      This file is the SOURCE TEMPLATE, not a served document. The prerender
      reads the BUILT dist/index.html and writes the head into every output
      file, including this one's, so a tag here would be a second place the
      same decision is made — and the one place that no test reads.

      crawlPolicyFiles.test.ts asserts this file stays canonical-free;
      prerenderDocument.test.ts asserts every generated document has one.
    -->
    <meta
      name="description"
      content="DDP Brokerage buys from licensed Thai producers for a certified pharmaceutical buyer in Central Europe. Send your documentation as it is — our team reviews it."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Caprasimo, Figtree and IBM Plex Mono are the Organic design system's three
      faces. They were NOT loaded until 2026-08-12, and styles/organicScoped.css
      says of the @import it dropped: "The faces are loaded with a <link> where
      this is used." That link was never added.

      So every Organic screen — the farm portal, evidence review, the Operations
      Desk — specified `--font-heading: Caprasimo` and rendered system-ui, and
      every mono identifier specified IBM Plex Mono and rendered the generic
      monospace. Measured: document.fonts registered only Inter, JetBrains Mono,
      Noto Serif and Sarabun. Note document.fonts.check() is NOT the way to test
      this — it returns true for an absent family, because falling back to a
      system font counts as "available".

      Caprasimo is requested at 400 and nothing else: it ships one weight, and
      asking for 600/700 makes the browser synthesise a bold that smears.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&family=Caprasimo&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
